name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 还原依赖
        run: dotnet restore OurStory.sln

      - name: 编译
        run: dotnet build OurStory.sln -c Release --no-restore

      - name: 跑测试
        run: dotnet test OurStory.sln -c Release --no-build --verbosity normal

      - name: 检查发布能不能打出来
        run: dotnet publish src/OurStory.Web/OurStory.Web.csproj -c Release -o /tmp/publish --no-build

      - name: 确认迁移是最新的
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet dotnet-ef migrations has-pending-model-changes \
            --project src/OurStory.Data/OurStory.Data.csproj

  frontend:
    name: 前端资源检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: 检查全部 JavaScript 文件
        run: find src/OurStory.Web/wwwroot/assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: 检查必要资源都在
        run: |
          set -euxo pipefail
          for file in variables core home moments admin; do
            test -f "src/OurStory.Web/wwwroot/assets/${file}.css"
          done
          test -f src/OurStory.Web/wwwroot/favicon.ico
          test -f screenshot.png
          file screenshot.png | grep -q 'PNG image data'

  docker:
    name: Docker 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 验证 Compose 配置
        run: docker compose config --quiet

      - name: 构建镜像
        run: docker build -f docker/Dockerfile -t ourstory:ci .

      - name: 检查发布必需文件
        run: |
          set -euxo pipefail
          test -f LICENSE
          test -f README.md
          test ! -f .env
